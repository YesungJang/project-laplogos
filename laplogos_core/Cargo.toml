[package]
name = "aix_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Node",
    "Window",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlParagraphElement",
    "HtmlDivElement",
    "HtmlInputElement",
    "Response",
    "Url",
    "console",
]
